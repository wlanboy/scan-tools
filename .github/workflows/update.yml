name: Update Data

on:
  schedule:
    - cron: "17 4 * * 1" # Montags 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --force: Die Altersprüfung nutzt die mtime der Datei, die nach dem Checkout immer frisch ist
      - name: Spring Advisories
        run: uv run spring/advisories.py download --force

      - name: KEV-Katalog
        run: uv run kev/catalog.py download --force

      - name: Node.js-Schwachstellen
        run: uv run nodejs/vulnerabilities.py download --force

      - name: Istio CVEs
        run: istio/update.sh

      - name: Kafka CVEs
        run: kafka/update.sh

      - name: Hadoop CVEs
        run: hadoop/update.sh

      - name: Commit & Push
        run: |
          files="spring/advisories.json kev/known_exploited_vulnerabilities.json nodejs/vulnerabilities.json istio/istio-cves.json kafka/cves.json hadoop/cves.json cve/cve-counts.json"
          git add $files
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Spring/KEV/Node.js/Istio/Kafka/Hadoop/CVE Daten ($(date -u +%Y-%m-%d))"
          git push
