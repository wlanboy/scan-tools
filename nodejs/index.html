<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node.js-Schwachstellen</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <p class="back"><a href="../">← Übersicht</a></p>
    <h1>Node.js-Schwachstellen</h1>
    <p id="meta" class="muted">Lade Daten …</p>
  </header>

  <main>
    <form id="filters" autocomplete="off">
      <input type="search" name="q" placeholder="Suche (alle Begriffe, &quot;Phrase&quot; möglich)" aria-label="Suche" class="grow">
      <select name="line" aria-label="Release-Linie">
        <option value="">Alle Release-Linien</option>
      </select>
      <select name="severity" aria-label="Mindest-Severity">
        <option value="">Jede Severity</option>
        <option value="MEDIUM">ab MEDIUM</option>
        <option value="HIGH">ab HIGH</option>
        <option value="CRITICAL">nur CRITICAL</option>
      </select>
      <label>ab <input type="date" name="since"></label>
      <label>bis <input type="date" name="until"></label>
      <button type="reset">Zurücksetzen</button>
    </form>

    <div id="fallback" hidden>
      <p>Die Daten konnten nicht automatisch geladen werden (z. B. weil die Seite per <code>file://</code> geöffnet wurde).</p>
      <label>JSON-Datei wählen: <input type="file" accept=".json,application/json"></label>
    </div>

    <p id="status" class="muted" aria-live="polite"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="published" aria-sort="descending"><button type="button">Veröffentlicht</button></th>
            <th data-key="id"><button type="button">CVE</button></th>
            <th data-key="severity"><button type="button">Severity</button></th>
            <th data-key="lines"><button type="button">Release-Linien</button></th>
            <th data-key="title"><button type="button">Titel</button></th>
            <th data-key="patched"><button type="button">Gepatcht</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <button id="more" type="button" hidden></button>
  </main>
</body>
</html>
